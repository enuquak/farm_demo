syntax = "proto3";

package farm;

option optimize_for = LITE_RUNTIME;

// 心跳消息
message Heartbeat {
    uint64 timestamp = 1;
}

// 登录请求
message LoginReq {
    string token = 1;
}

// 登录响应
message LoginResp {
    int32 code = 1;
    string msg = 2;
}

// 账号消息封装 (Client -> Gate)
message AccountMsg {
    string account_id = 1;      // 账号 ID
    uint32 msg_id = 2;          // 业务消息 ID
    bytes payload = 3;          // 业务消息体
}

// 玩家消息封装 (Client -> Gate)
message PlayerMsg {
    uint64 player_id = 1;       // 玩家 ID
    uint32 server_id = 2;       // 服务器 ID
    uint32 msg_id = 3;          // 业务消息 ID
    bytes payload = 4;          // 业务消息体
}
