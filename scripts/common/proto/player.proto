syntax = "proto3";

package farm;

option optimize_for = LITE_RUNTIME;

// ===========================================
// 玩家消息协议
// MsgID 范围: 2000-2999 (客户端<->Gate<->Game)
// ===========================================

// 玩家数据
message PlayerData {
    uint64 player_id = 1;       // 玩家 ID
    uint32 server_id = 2;       // 服务器 ID
    string role_name = 3;       // 角色名
    uint32 level = 4;           // 等级
    uint64 exp = 5;             // 经验值
    float pos_x = 6;            // 位置 X
    float pos_y = 7;            // 位置 Y
    uint64 created_at = 8;      // 创建时间
    float pos_z = 9;            // 位置 Z
    string scene_id = 10;       // 场景 ID
    int32 energy = 11;          // 能量值
}

// 进入游戏请求 (Client -> Gate -> Game)
message EnterGameReq {
    uint64 player_id = 1;       // 玩家 ID
    uint32 server_id = 2;       // 服务器 ID
}

// 进入游戏响应 (Game -> Gate -> Client)
message EnterGameResp {
    int32 code = 1;             // 0=成功, 1=角色不存在, 2=服务器不可用
    string msg = 2;
    PlayerData player_data = 3; // 玩家数据
    EnergySync energy = 4;      // 能量数据
    ClockSync clock = 5;        // 时钟数据
}

// 物品使用请求 (Client -> Game)
message ItemUseReq {
    int32 target_x = 1;         // 目标 tile X
    int32 target_y = 2;         // 目标 tile Y
    string direction = 3;       // 玩家朝向
    int32 active_slot = 4;      // 当前激活的背包格子
}

// 能量同步 (Game -> Client)
message EnergySync {
    int32 current = 1;          // 当前能量值
    int32 max = 2;              // 最大能量值
}

// 物品使用响应 (Game -> Client)
message ItemUseResp {
    int32 code = 1;             // 0=成功, 其他=错误码
    string msg = 2;
    EnergySync energy = 5;      // 能量数据（变更时携带）
}

// 玩家背包数据
message InventoryData {
    string inventory_json = 1;  // 背包 JSON 数据
}

// 农场状态同步 (Game -> Client)
message FarmStateSync {
    string world_json = 1;      // 世界状态 JSON
    string crop_json = 2;       // 作物状态 JSON
}

// 场景切换请求 (Client -> Game)
message SceneChangeReq {
    string target_scene = 1;    // 目标场景 ID
    string target_portal_id = 2; // 目标 Portal ID
}

// 场景切换响应 (Game -> Client)
message SceneChangeResp {
    int32 code = 1;             // 0=成功, 其他=错误码
    string msg = 2;
    string target_scene = 3;    // 目标场景 ID
    int32 spawn_x = 4;          // 出生点 X (tile)
    int32 spawn_y = 5;          // 出生点 Y (tile)
    string active_scene = 6;    // 当前活跃场景 ID
}

// ===========================================
// 游戏时钟协议
// ===========================================

// 时钟同步 (Game -> Client)
// 每个 time_slot 跳变时广播
message ClockSync {
    int32 day = 1;              // 天数
    int32 time_slot = 2;        // 时间槽 (0~39)
    bool paused = 3;            // 是否暂停
}

// 强制睡觉通知 (Game -> Client)
// 当 time_slot 达到 40 时发送
message ForceSleepNotify {
    int32 day = 1;              // 当前天数
}

// 强制睡觉就绪 (Client -> Game)
// 客户端 Iris 收缩完成后发送
message ForceSleepReady {
    int32 day = 1;              // 当前天数
}

// ===========================================
// 背包与物品协议
// ===========================================

// 掉落物同步 (Game -> Client)
message DropItemSync {
    uint32 drop_id = 1;         // 掉落物唯一 ID
    int32 item_id = 2;          // 物品 ID
    int32 count = 3;            // 数量
    float x = 4;                // 世界坐标 X (像素)
    float y = 5;                // 世界坐标 Y (像素)
    int32 action = 6;           // 0=spawn, 1=remove, 2=pickup
}

// 背包数据同步 (Game -> Client)
message InventorySync {
    string inventory_json = 1;  // 背包 JSON 数据
}

// 快捷栏选中格切换 (Client -> Game)
message ActiveSlotChange {
    int32 active_slot = 1;      // 新的选中格索引 (0-9)
}

// 位置更新 (Client -> Game)
message PositionUpdate {
    float pos_x = 1;            // 位置 X (像素)
    float pos_y = 2;            // 位置 Y (像素)
    float pos_z = 3;            // 位置 Z (像素)
    uint64 timestamp = 4;       // 客户端时间戳 (ms)
}

// 位置纠正 (Game -> Client)
message PositionCorrect {
    float pos_x = 1;            // 纠正后位置 X (像素)
    float pos_y = 2;            // 纠正后位置 Y (像素)
    float pos_z = 3;            // 纠正后位置 Z (像素)
    uint64 timestamp = 4;       // 原始更新的时间戳 (ms)
}

// ===========================================
// 通知提示协议
// ===========================================

// 通知类型枚举
enum NotifyType {
    NOTIFY_DAWN = 0;           // 天亮了
    NOTIFY_DUSK = 1;           // 天黑了
    NOTIFY_ITEM_SUCCESS = 2;   // 物品使用成功
    NOTIFY_ITEM_FAIL = 3;      // 物品使用失败
    NOTIFY_SYSTEM = 4;         // 系统公告
}

// 服务器通知 (Game -> Client)
message NotifyToast {
    NotifyType type = 1;       // 通知类型
    string title = 2;          // 标题
    string content = 3;        // 内容（可选）
    int32 priority = 4;        // 优先级：0=LOW, 1=NORMAL, 2=HIGH, 3=CRITICAL
    int32 duration_ms = 5;     // 显示时长（毫秒）
    bool is_marquee = 6;       // 是否为跑马灯
}
